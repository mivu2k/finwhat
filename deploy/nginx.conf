# Web app at /, API at /api/. Replace YOUR_DOMAIN_OR_IP. HTTPS is added by certbot or by a tunnel (see docs/DEPLOY.md).
server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    root /opt/expensechat/dist;
    index index.html;
    client_max_body_size 25m;   # the API accepts uploads up to 20 MB

    location /api/ {
        proxy_pass http://127.0.0.1:4000/;   # trailing slash removes /api
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 320s;             # a local AI can take minutes on one receipt
    }

    location / {
        try_files $uri /index.html;
    }
}
